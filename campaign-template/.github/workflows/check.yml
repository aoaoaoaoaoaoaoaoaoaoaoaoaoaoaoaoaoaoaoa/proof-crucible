name: Check

on:
  push:
    branches:
      - main
      - "attempt/**"
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Fetch live attempt refs
        run: git fetch --prune origin '+refs/heads/attempt/*:refs/remotes/origin/attempt/*'
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-mathlib-cache: true
      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install --yes graphviz
      - name: Verify campaign
        run: scripts/check.sh
